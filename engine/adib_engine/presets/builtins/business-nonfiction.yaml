id: business-nonfiction
name: Business Nonfiction
description: Direct, modern register for business and self-improvement books.
system_prompt: >-
  Translate as a publishing-house translator for business nonfiction. Keep the
  persuasive, direct tone, preserve anecdote names and company/product names via
  the glossary, and prefer concise, contemporary Persian.
language_register: neutral
default_glossary_policy: translate_paren
footnotes:
  first_use_per_chapter: true
  build_appendix: true
  link_to_appendix: true
typography:
  page_size: trade
  margin_inner_mm: 22.0
  margin_outer_mm: 16.0
  margin_top_mm: 20.0
  margin_bottom_mm: 20.0
  body_font: Vazirmatn
  latin_font: Noto Serif
  body_size_pt: 11.0
  leading: 1.7
  paragraph_indent_em: 0.4
  justify: true
  hyphenate: false
  digit_style: persian
  show_page_numbers: true
  show_running_heads: true
qa_rules:
  - numbers-unchanged
  - glossary-consistency
  - length-ratio
builtin: true
