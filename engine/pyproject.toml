[project]
name = "adib-engine"
version = "0.1.0"
description = "Adib book translation engine: ingest, analyze, translate, typeset."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-ai>=2.23",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # ingest
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[project.optional-dependencies]
# Heavy ML fallback parser. Installed separately so the base engine stays light.
docling = ["docling>=2.14"]

[project.scripts]
adib-engine = "adib_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyinstaller>=6.11",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adib_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires `Depends(...)` as an argument
# default; that is not the mutable-default-argument bug B008 exists to catch.
"adib_engine/api/routes/*.py" = ["B008"]
"adib_engine/api/deps.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
